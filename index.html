<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Endlessly Blessed — Rhea Lyn</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@300;400&display=swap');
  :root { --silver:#f4f1f4; --muted:#b9b0bd; }
  * { box-sizing:border-box; }
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#030205; }
  body { color:var(--silver); font-family:'Cormorant Garamond',serif; }
  .scene { position:relative; width:100vw; height:100vh; min-height:480px; overflow:hidden; isolation:isolate;
    background: radial-gradient(ellipse at 50% 55%, #24172b 0%, #100b17 42%, #030205 82%); }
  .moon { position:absolute; width:clamp(90px,13vw,175px); aspect-ratio:1; border-radius:50%; top:9%; right:16%;
    background:radial-gradient(circle at 35% 35%,#fff 0,#d8d1df 24%,#9d91aa 55%,#44394d 74%,transparent 76%);
    opacity:.75; filter:drop-shadow(0 0 30px #d9cce955); }
  .stars { position:absolute; inset:0; pointer-events:none; }
  .star { position:absolute; width:2px; height:2px; border-radius:50%; background:#fff; opacity:.4;
    box-shadow:0 0 7px 2px #e9dfff88; animation:twinkle var(--dur,3s) ease-in-out infinite alternate; }
  @keyframes twinkle { from{opacity:.15;transform:scale(.7)} to{opacity:1;transform:scale(1.7)} }
  .aurora { position:absolute; width:80vw; height:30vh; top:20%; left:10%; border-radius:50%;
    background:#8b6a9c; filter:blur(85px); opacity:.09; animation:glow 9s ease-in-out infinite alternate; }
  @keyframes glow { to{transform:translate(7vw,3vh) scale(1.15);opacity:.16} }
  .horizon { position:absolute; inset:auto 0 0; height:53%; overflow:hidden; }
  .ridge { position:absolute; inset:auto 0 0; width:200%; height:100%; }
  .ridge.back { height:100%; opacity:.7; background:#21182b; clip-path:polygon(0 55%,8% 36%,17% 57%,27% 25%,38% 56%,49% 32%,59% 60%,70% 27%,81% 56%,91% 34%,100% 55%,100% 100%,0 100%);
    animation:drift 48s linear infinite; }
  .ridge.mid { height:75%; background:#120f1c; clip-path:polygon(0 40%,12% 20%,23% 47%,35% 12%,46% 42%,58% 18%,70% 45%,83% 14%,100% 40%,100% 100%,0 100%);
    animation:drift 30s linear infinite reverse; }
  .ridge.front { height:48%; background:#08070d; clip-path:polygon(0 28%,13% 8%,25% 32%,39% 4%,52% 29%,65% 10%,78% 31%,90% 7%,100% 26%,100% 100%,0 100%);
    animation:drift 19s linear infinite; }
  @keyframes drift { from{transform:translateX(0)} to{transform:translateX(-50%)} }
  .ground { position:absolute; bottom:0; width:100%; height:19%; background:linear-gradient(#0b0810,#030205 75%); }
  .mist { position:absolute; bottom:17%; left:-20%; width:140%; height:12%; background:#bca7c8; filter:blur(35px); opacity:.10;
    animation:mist 18s ease-in-out infinite alternate; }
  @keyframes mist { to{transform:translateX(12%)} }
  .copy { position:absolute; z-index:5; width:min(90vw,760px); left:50%; top:12%; transform:translateX(-50%); text-align:center;
    text-shadow:0 0 18px #fff5,0 2px 22px #000; pointer-events:none; }
  .line { display:block; font-family:'Great Vibes','Brush Script MT',cursive; font-weight:400; line-height:.92;
    letter-spacing:.01em; color:#fff; }
  .line.one { font-size:clamp(3.8rem,10vw,8.2rem); }
  .line.two { font-size:clamp(3.5rem,9vw,7.3rem); margin-top:.08em; }
  .line.three { font-size:clamp(3.5rem,9vw,7.3rem); margin-top:.02em; }
  .line.four { font-size:clamp(3.5rem,9vw,7.3rem); margin-top:.02em; }
  .signature { position:absolute; z-index:7; right:5.5%; bottom:4.5%; font-family:'Great Vibes',cursive;
    font-size:clamp(1.7rem,3vw,2.8rem); color:#eee8f0; letter-spacing:.03em; text-shadow:0 0 12px #fff8; }
  /* A stylized, original running jaguar silhouette */
  .cat-wrap { position:absolute; z-index:4; left:-24%; bottom:13%; width:clamp(190px,27vw,370px);
    animation:catRun 17s linear infinite; filter:drop-shadow(0 0 12px #d9c6d833); }
  @keyframes catRun { 0%{transform:translateX(0)} 100%{transform:translateX(145vw)} }
  .cat { width:100%; overflow:visible; animation:bob .42s ease-in-out infinite alternate; }
  @keyframes bob { from{transform:translateY(0)} to{transform:translateY(-7px)} }
  .leg { transform-box:fill-box; transform-origin:top center; animation:legs .42s ease-in-out infinite alternate; }
  .leg.back { animation-delay:-.21s; }
  @keyframes legs { from{transform:rotate(28deg)} to{transform:rotate(-35deg)} }
  .sparkle { position:absolute; z-index:6; color:#fff; font-size:12px; opacity:0; pointer-events:none;
    text-shadow:0 0 8px white,0 0 18px #e3c8ff; animation:floatSpark var(--time,5s) linear infinite; }
  @keyframes floatSpark { 0%{opacity:0;transform:translate3d(0,25px,0) rotate(0) scale(.5)}
    15%{opacity:.9} 75%{opacity:.75} 100%{opacity:0;transform:translate3d(var(--dx,25px),-120px,0) rotate(180deg) scale(1.2)} }
  .vignette { position:absolute; inset:0; z-index:8; pointer-events:none; box-shadow:inset 0 0 140px 35px #000b; }
  .hint { position:absolute; z-index:9; left:18px; bottom:17px; color:#b6aaba88; font:10px 'Cormorant Garamond',serif; letter-spacing:.18em; text-transform:uppercase; }
  @media(max-height:600px){ .copy{top:7%}.line.one{font-size:clamp(3rem,8vh,5rem)}.line.two,.line.three,.line.four{font-size:clamp(2.8rem,7vh,4.5rem)}.cat-wrap{bottom:9%} }
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:30s!important;}}
</style>
</head>
<body>
<main class="scene" aria-label="Endlessly blessed, forever grateful animated night landscape">
  <div class="moon"></div><div class="aurora"></div>
  <div class="stars" id="stars"></div>
  <section class="copy" aria-label="Endlessly blessed, forever grateful">
    <span class="line one">Endlessly</span>
    <span class="line two">blessed,</span>
    <span class="line three">forever</span>
    <span class="line four">grateful.</span>
  </section>
  <div class="horizon">
    <div class="ridge back"></div><div class="ridge back" style="left:100%"></div>
    <div class="ridge mid"></div><div class="ridge mid" style="left:100%"></div>
    <div class="ridge front"></div><div class="ridge front" style="left:100%"></div>
    <div class="mist"></div><div class="ground"></div>
  </div>
  <div class="cat-wrap" aria-hidden="true">
    <svg class="cat" viewBox="0 0 520 230" xmlns="http://www.w3.org/2000/svg">
      <g fill="#050408" stroke="#d5c8d8" stroke-opacity=".24" stroke-width="2">
        <path d="M72 104 C105 72 153 70 211 81 C255 65 309 66 354 87 C380 72 407 71 431 83
          L461 70 L475 82 L462 97 C455 112 437 119 414 115 L389 107 C371 125 351 136 326 139
          L299 136 C276 147 245 147 220 135 C184 146 151 138 125 126 L98 131 C78 130 64 119 72 104Z"/>
        <path d="M91 106 C60 96 45 79 30 63 C18 51 8 55 14 67 C29 91 49 116 80 123" fill="none" stroke-width="10" stroke-linecap="round"/>
        <path d="M391 86 L403 57 L419 83 L438 56 L444 91" />
      </g>
      <g fill="none" stroke="#050408" stroke-width="19" stroke-linecap="round">
        <path class="leg" d="M155 124 Q147 157 123 182 L111 204"/>
        <path class="leg back" d="M197 128 Q218 158 206 184 L216 207"/>
        <path class="leg" d="M327 126 Q349 154 372 175 L384 201"/>
        <path class="leg back" d="M355 119 Q380 143 393 164 L420 183"/>
      </g>
      <g fill="#bca9c8" opacity=".55">
        <circle cx="140" cy="99" r="4"/><circle cx="170" cy="91" r="3"/><circle cx="201" cy="104" r="4"/>
        <circle cx="236" cy="89" r="3"/><circle cx="274" cy="101" r="4"/><circle cx="309" cy="91" r="3"/>
        <circle cx="341" cy="107" r="4"/><circle cx="378" cy="96" r="3"/>
      </g>
    </svg>
  </div>
  <div class="signature">– Rhea Lyn</div>
  <div class="hint">a little reminder to stay grateful</div>
  <div class="vignette"></div>
</main>
<script>
  const stars = document.getElementById('stars');
  for (let i=0;i<95;i++){
    const s=document.createElement('i'); s.className='star';
    s.style.left=(Math.random()*100)+'%'; s.style.top=(Math.random()*78)+'%';
    s.style.setProperty('--dur',(2+Math.random()*5)+'s');
    s.style.animationDelay=(-Math.random()*6)+'s';
    const size=1+Math.random()*2.2; s.style.width=size+'px'; s.style.height=size+'px';
    stars.appendChild(s);
  }
  const symbols=['✧','✦','⋆','·','✧'];
  for(let i=0;i<34;i++){
    const p=document.createElement('span'); p.className='sparkle';
    p.textContent=symbols[Math.floor(Math.random()*symbols.length)];
    p.style.left=(Math.random()*100)+'%'; p.style.top=(35+Math.random()*62)+'%';
    p.style.setProperty('--time',(4+Math.random()*8)+'s');
    p.style.setProperty('--dx',(-35+Math.random()*70)+'px');
    p.style.animationDelay=(-Math.random()*12)+'s';
    p.style.fontSize=(9+Math.random()*13)+'px';
    document.querySelector('.scene').appendChild(p);
  }
</script>
</body>
</html>
